# Alternativa a `bun run dev`: misma imagen de despliegue (API + front compilado) en http://localhost:3000.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agente-contratos
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    init: true
    restart: unless-stopped
