services:
  api:
    build:
      context: .
      dockerfile: langgraph_app/Dockerfile
    image: agente-contratos-api
    ports:
      - "8787:8787"
    env_file:
      - path: langgraph_app/.env
        required: false
    environment:
      ROOT_DIR: /app
      OUT_DIR: /app/data
      API_PORT: "8787"
    volumes:
      - api-data:/app/data
    init: true
    restart: unless-stopped

volumes:
  api-data:
