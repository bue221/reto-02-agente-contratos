name: Backend CI

on:
  push:
    branches: [main]
    paths: &rutas-backend
      - "api/**"
      - "agent/**"
      - "modulo/**"
      - "fixtures/**"
      - "demo.ts"
      - "package.json"
      - "bun.lock"
      # La imagen de despliegue compila el front y comparte api/src/http/types.ts con él.
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  pull_request:
    paths: *rutas-backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  # CI nunca llama a Gemini: el proveedor offline es determinista y no necesita secretos.
  LLM_PROVIDER: offline

jobs:
  verificar:
    name: Typecheck, tests y demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache de dependencias
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck de la API
        run: bun run --cwd api typecheck && bun run --cwd studio typecheck

      - name: Módulo sincronizado con agent/ y el conocimiento
        run: bun run sync:module --check

      - name: Tests
        run: bun test

      - name: Demo sin modelo (smoke)
        run: bun run demo

  imagen:
    name: Imagen Docker y health check
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGEN: agente-contratos:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar contenedor y esperar /api/health
        run: |
          docker run -d --name api -p 3000:3000 -e LLM_PROVIDER "$IMAGEN"
          for intento in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              echo "API sana tras $intento intento(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/health no respondió en 30 s"
          docker logs api
          exit 1

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true

  desplegar:
    name: Desplegar en AWS Lightsail
    needs: imagen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SERVICIO: reto02-contratos
      AWS_REGION: us-east-1
      IMAGEN: reto02-contratos:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGEN }}
          cache-from: type=gha

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Subir imagen a Lightsail
        id: subir
        run: |
          salida=$(aws lightsail push-container-image --service-name "$SERVICIO" --label app --image "$IMAGEN")
          echo "$salida"
          referencia=$(echo "$salida" | grep -o ":$SERVICIO\.app\.[0-9]*" | tail -1)
          [ -n "$referencia" ] || { echo "::error::No se pudo leer la referencia de la imagen subida"; exit 1; }
          echo "referencia=$referencia" >> "$GITHUB_OUTPUT"

      # Reutiliza variables, puertos y health check del despliegue vigente: la clave de Gemini
      # solo vive en Lightsail. No se imprime nada de este paso porque incluye esas variables.
      - name: Crear despliegue con la imagen nueva
        env:
          REFERENCIA: ${{ steps.subir.outputs.referencia }}
        run: |
          aws lightsail get-container-services --service-name "$SERVICIO" --output json > servicio.json
          jq --arg imagen "$REFERENCIA" '.containerServices[0].currentDeployment
            | { containers: (.containers | map_values(.image = $imagen)), publicEndpoint }' servicio.json > despliegue.json
          aws lightsail create-container-service-deployment --service-name "$SERVICIO" \
            --cli-input-json "$(jq --arg s "$SERVICIO" '. + {serviceName: $s}' despliegue.json)" > /dev/null
          rm -f servicio.json despliegue.json

      - name: Esperar a que el despliegue quede activo
        env:
          REFERENCIA: ${{ steps.subir.outputs.referencia }}
        run: |
          for intento in $(seq 1 60); do
            servicio=$(aws lightsail get-container-services --service-name "$SERVICIO" --output json)
            actual=$(echo "$servicio" | jq -r '.containerServices[0].currentDeployment | "\(.state) \([.containers[].image] | first)"')
            siguiente=$(echo "$servicio" | jq -r '.containerServices[0].nextDeployment.state // "ninguno"')
            echo "intento $intento: vigente=$actual siguiente=$siguiente"
            [ "$actual" = "ACTIVE $REFERENCIA" ] && exit 0
            [ "$siguiente" = "FAILED" ] && { echo "::error::El despliegue falló en Lightsail"; exit 1; }
            sleep 15
          done
          echo "::error::El despliegue no quedó activo en 15 min"
          exit 1

      - name: Verificar rutas públicas
        run: |
          url=$(aws lightsail get-container-services --service-name "$SERVICIO" --query 'containerServices[0].url' --output text)
          for ruta in /api/health /api/buzon /api/bandeja; do
            curl -fsS -o /dev/null -w "$ruta %{http_code}\n" "${url%/}$ruta"
          done
